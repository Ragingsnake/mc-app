apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minecraft-story-dev
  namespace: argocd
  labels:
    environment: dev
spec:
  project: default
  source:
    repoURL: http://gitea:3000/ragingsnake/story-app.git  # UPDATE THIS to your actual Gitea repo URL
    targetRevision: main
    path: helm/minecraft-story-app
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: mc-app-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
