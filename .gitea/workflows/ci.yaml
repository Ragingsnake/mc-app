name: CI Chain

on:
  workflow_dispatch:

env:
  REGISTRY: docker.io/ragingsnake/mc-app

jobs:
  sys-scan:
    runs-on: ubuntu-system
    container:
      image: nikolaik/python-nodejs:python3.10-nodejs20

    steps:
    - name: Pull repo
      uses: actions/checkout@v4

    - name: Install tools
      run: |
        apt-get update && apt-get install -y docker.io python3 python3-pip

    - name: Log in to Docker Hub
      run: |
        echo "${{ secrets.DOCKER_PAT }}" | docker login -u "ragingsnake" --password-stdin

    - name: Sequential Build and Scan
      run: |
        SERVICES="frontend api-gateway story-orchestrator scenario-gen battle-gen character-gen endings-gen story-db-service ai-enhancer"
        for SERVICE in $SERVICES; do
          echo "========================================"
          echo " Processing $SERVICE"
          echo "========================================"
          
          if [ "$SERVICE" = "frontend" ]; then
            SVC_PATH="frontend"
            (
              cd $SVC_PATH
              rm -rf node_modules package-lock.json
              npm install
              npm install @oxlint/binding-linux-x64-gnu
              npm run lint
              npm run build
            )
          else
            SVC_PATH="backend/$SERVICE"
            (
              cd $SVC_PATH
              python3 -m py_compile app.py
            )
          fi

          (
            cd $SVC_PATH
            
            # Trivy scan
            cat <<EOF > Dockerfile.trivy
        FROM aquasec/trivy:latest
        COPY . /app-to-scan
        WORKDIR /app-to-scan
        EOF
            docker build -f Dockerfile.trivy -t disposable-trivy-scanner-$SERVICE .
            docker run --rm \
              -e http_proxy -e https_proxy -e no_proxy -e HTTP_PROXY -e HTTPS_PROXY -e NO_PROXY \
              -e TRIVY_INSECURE=true \
              disposable-trivy-scanner-$SERVICE fs \
              --db-repository ghcr.io/aquasecurity/trivy-db:2 \
              --timeout 15m \
              --severity CRITICAL,HIGH \
              --exit-code 1 .
            
            # Build and Push
            docker build \
              --build-arg HTTP_PROXY=$HTTP_PROXY \
              --build-arg HTTPS_PROXY=$HTTPS_PROXY \
              --build-arg NO_PROXY=$NO_PROXY \
              --build-arg http_proxy=$http_proxy \
              --build-arg https_proxy=$https_proxy \
              --build-arg no_proxy=$no_proxy \
              -t ${{ env.REGISTRY }}:$SERVICE-${{ github.sha }} .
            docker push ${{ env.REGISTRY }}:$SERVICE-${{ github.sha }}
          )
        done

  update-image-tags:
    needs: sys-scan
    runs-on: ubuntu-system
    container:
      image: nikolaik/python-nodejs:python3.10-nodejs20

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        apt-get update && apt-get install -y python3 python3-pip
        pip install pyyaml

    - name: Update tags in values.yaml
      run: |
        cat << 'EOF' > /tmp/update_tags.py
        import yaml, sys
        sha = sys.argv[1]
        services = ['frontend', 'api-gateway', 'story-orchestrator', 'scenario-gen', 'battle-gen', 'character-gen', 'endings-gen', 'story-db-service', 'ai-enhancer']
        
        with open('helm/minecraft-story-app/values.yaml', 'r') as f:
            data = yaml.safe_load(f)
            
        for service in services:
            if service == 'frontend':
                data['frontend']['image']['tag'] = sha
            else:
                data['microservices'][service]['image']['tag'] = sha
            print(f'Updated {service} tag to {sha}')
            
        with open('helm/minecraft-story-app/values.yaml', 'w') as f:
            yaml.dump(data, f, default_flow_style=False, allow_unicode=True)
        EOF
        python3 /tmp/update_tags.py ${{ github.sha }}

    - name: Commit and Push
      run: |
        git config user.name "ci-bot"
        git config user.email "ci@ragingsnake.dev"
        git remote set-url origin http://${{ secrets.GTEA_TOKEN }}@git.digital-easy.link:5000/TranBuiNhatNguyen/story-app.git
        git add helm/minecraft-story-app/values.yaml
        # Only commit if there's actually a change
        git diff --cached --exit-code && echo "No change, skipping." && exit 0
        git commit -m "ci: update image tags to ${{ github.sha }} [skip ci]"
        # Pull rebase in case another workflow pushed just before us
        for i in {1..5}; do
          git pull --rebase origin main && git push origin HEAD:main && break || sleep 5
        done
