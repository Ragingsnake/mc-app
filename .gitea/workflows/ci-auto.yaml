name: CI Chain (Smart)

on:
  push:
    paths:
      - 'frontend/**'
      - 'backend/**'
  workflow_dispatch:

env:
  REGISTRY: docker.io/ragingsnake/mc-app

jobs:
  detect-changes:
    runs-on: self-hosted
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend: 'frontend/**'
            api-gateway: 'backend/api-gateway/**'
            story-orchestrator: 'backend/story-orchestrator/**'
            scenario-gen: 'backend/scenario-gen/**'
            battle-gen: 'backend/battle-gen/**'
            character-gen: 'backend/character-gen/**'
            endings-gen: 'backend/endings-gen/**'
            story-db-service: 'backend/story-db-service/**'

  sys-scan:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.changes != '[]' && needs.detect-changes.outputs.changes != '' }}
    runs-on: self-hosted
    container:
      image: nikolaik/python-nodejs:python3.10-nodejs20
    
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.changes) }}

    steps:
    - name: Pull repo
      uses: actions/checkout@v4

    - name: Set working directory path
      run: |
        if [ "${{ matrix.service }}" = "frontend" ]; then
          echo "SVC_PATH=./frontend" >> $GITHUB_ENV
        else
          echo "SVC_PATH=./backend/${{ matrix.service }}" >> $GITHUB_ENV
        fi

    - name: Install Docker CLI
      run: |
        apt-get update && apt-get install -y docker.io

    - name: Lint check
      working-directory: ${{ env.SVC_PATH }}
      run: |
        if [ "${{ matrix.service }}" = "frontend" ]; then
          rm -rf node_modules package-lock.json
          npm install
          npm install @oxlint/binding-linux-x64-gnu
          npm run lint
          npm run build
        else
          python -m py_compile app.py
        fi
    
    - name: Trivy Filesystem Scan (The Docker Way)
      working-directory: ${{ env.SVC_PATH }}
      run: |
        cat <<EOF > Dockerfile.trivy
        FROM aquasec/trivy:latest
        COPY . /app-to-scan
        WORKDIR /app-to-scan
        EOF
        
        docker build -f Dockerfile.trivy -t disposable-trivy-scanner .
        docker run --rm \
          -e http_proxy -e https_proxy -e no_proxy -e HTTP_PROXY -e HTTPS_PROXY -e NO_PROXY \
          -e TRIVY_INSECURE=true \
          disposable-trivy-scanner fs --db-repository public.ecr.aws/aquasecurity/trivy-db:2 --severity CRITICAL,HIGH --exit-code 1 .

    - name: Log in to Docker Hub
      run: |
        echo "${{ secrets.DOCKER_PAT }}" | docker login -u "ragingsnake" --password-stdin

    - name: Build Docker Image
      working-directory: ${{ env.SVC_PATH }}
      run: |
        docker build \
          --build-arg HTTP_PROXY=$HTTP_PROXY \
          --build-arg HTTPS_PROXY=$HTTPS_PROXY \
          --build-arg NO_PROXY=$NO_PROXY \
          --build-arg http_proxy=$http_proxy \
          --build-arg https_proxy=$https_proxy \
          --build-arg no_proxy=$no_proxy \
          -t ${{ env.REGISTRY }}:${{ matrix.service }}-${{ github.sha }} .

    - name: Push Docker Image
      run: |
        docker push ${{ env.REGISTRY }}:${{ matrix.service }}-${{ github.sha }}
