name: CI Chain (Smart)

on:
  push:
    paths:
      - 'frontend/**'
      - 'backend/**'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build and tag (e.g. frontend, api-gateway, ai-enhancer). Leave empty to build ALL.'
        required: false
        default: ''

env:
  REGISTRY: docker.io/ragingsnake/mc-app

jobs:
  detect-changes:
    runs-on: self-hosted
    outputs:
      changes: ${{ steps.set-output.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            frontend: 'frontend/**'
            api-gateway: 'backend/api-gateway/**'
            story-orchestrator: 'backend/story-orchestrator/**'
            scenario-gen: 'backend/scenario-gen/**'
            battle-gen: 'backend/battle-gen/**'
            character-gen: 'backend/character-gen/**'
            endings-gen: 'backend/endings-gen/**'
            story-db-service: 'backend/story-db-service/**'
            ai-enhancer: 'backend/ai-enhancer/**'

      - name: Set changes output
        id: set-output
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.service }}" ]; then
              echo 'changes=["${{ github.event.inputs.service }}"]' >> $GITHUB_OUTPUT
            else
              echo 'changes=["frontend","api-gateway","story-orchestrator","scenario-gen","battle-gen","character-gen","endings-gen","story-db-service","ai-enhancer"]' >> $GITHUB_OUTPUT
            fi
          else
            echo "changes=${{ steps.filter.outputs.changes }}" >> $GITHUB_OUTPUT
          fi

  sys-scan:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.changes != '[]' && needs.detect-changes.outputs.changes != '' }}
    runs-on: self-hosted
    container:
      image: nikolaik/python-nodejs:python3.10-nodejs20

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.changes) }}

    env:
      SERVICE: ${{ matrix.service }}

    steps:
    - name: Pull repo
      uses: actions/checkout@v4

    - name: Set working directory path
      run: |
        if [ "$SERVICE" = "frontend" ]; then
          echo "SVC_PATH=./frontend" >> $GITHUB_ENV
        else
          echo "SVC_PATH=./backend/$SERVICE" >> $GITHUB_ENV
        fi

    - name: Install tools
      run: |
        apt-get update && apt-get install -y docker.io python3 python3-pip

    - name: Lint check (frontend)
      if: env.SERVICE == 'frontend'
      working-directory: ${{ env.SVC_PATH }}
      run: |
        rm -rf node_modules package-lock.json
        npm install
        npm install @oxlint/binding-linux-x64-gnu
        npm run lint

    - name: Build check (frontend)
      if: env.SERVICE == 'frontend'
      working-directory: ${{ env.SVC_PATH }}
      run: npm run build

    - name: Lint check (Python)
      if: env.SERVICE != 'frontend'
      working-directory: ${{ env.SVC_PATH }}
      run: python -m py_compile app.py

    - name: Trivy Filesystem Scan (The Docker Way)
      working-directory: ${{ env.SVC_PATH }}
      run: |
        cat <<EOF > Dockerfile.trivy
        FROM aquasec/trivy:latest
        COPY . /app-to-scan
        WORKDIR /app-to-scan
        EOF

        docker build -f Dockerfile.trivy -t disposable-trivy-scanner-$SERVICE .
        docker run --rm \
          -e http_proxy -e https_proxy -e no_proxy -e HTTP_PROXY -e HTTPS_PROXY -e NO_PROXY \
          -e TRIVY_INSECURE=true \
          disposable-trivy-scanner-$SERVICE fs --db-repository public.ecr.aws/aquasecurity/trivy-db:2 --severity CRITICAL,HIGH --exit-code 1 .

    - name: Log in to Docker Hub
      run: |
        echo "${{ secrets.DOCKER_PAT }}" | docker login -u "ragingsnake" --password-stdin

    - name: Build Docker Image
      working-directory: ${{ env.SVC_PATH }}
      run: |
        docker build \
          --build-arg HTTP_PROXY=$HTTP_PROXY \
          --build-arg HTTPS_PROXY=$HTTPS_PROXY \
          --build-arg NO_PROXY=$NO_PROXY \
          --build-arg http_proxy=$http_proxy \
          --build-arg https_proxy=$https_proxy \
          --build-arg no_proxy=$no_proxy \
          -t ${{ env.REGISTRY }}:${{ env.SERVICE }}-${{ github.sha }} .

    - name: Push Docker Image
      run: |
        docker push ${{ env.REGISTRY }}:${{ env.SERVICE }}-${{ github.sha }}

  update-image-tags:
    needs: [detect-changes, sys-scan]
    if: ${{ needs.detect-changes.outputs.changes != '[]' && needs.detect-changes.outputs.changes != '' }}
    runs-on: self-hosted
    container:
      image: nikolaik/python-nodejs:python3.10-nodejs20

    strategy:
      fail-fast: false
      max-parallel: 1  # MUST be 1 - prevents simultaneous pushes causing git conflicts
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.changes) }}

    env:
      SERVICE: ${{ matrix.service }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        apt-get update && apt-get install -y python3 python3-pip
        pip install pyyaml

    - name: Update tag in values.yaml
      run: |
        cat << 'EOF' > /tmp/update_tag.py
        import yaml, sys
        service = sys.argv[1]
        sha = sys.argv[2]
        with open('helm/minecraft-story-app/values.yaml', 'r') as f:
            data = yaml.safe_load(f)
        if service == 'frontend':
            data['frontend']['image']['tag'] = sha
        else:
            data['microservices'][service]['image']['tag'] = sha
        with open('helm/minecraft-story-app/values.yaml', 'w') as f:
            yaml.dump(data, f, default_flow_style=False, allow_unicode=True)
        print(f'Updated {service} tag to {sha}')
        EOF
        python3 /tmp/update_tag.py $SERVICE ${{ github.sha }}

    - name: Commit and Push
      run: |
        git config user.name "ci-bot"
        git config user.email "ci@ragingsnake.dev"
        git remote set-url origin http://${{ secrets.GTEA_TOKEN }}@git.digital-easy.link:5000/TranBuiNhatNguyen/story-app.git
        git add helm/minecraft-story-app/values.yaml
        # Only commit if there's actually a change
        git diff --cached --exit-code && echo "No change, skipping." && exit 0
        git commit -m "ci: update $SERVICE image tag to ${{ github.sha }} [skip ci]"
        # Retry with rebase in case a sibling job pushed just before us
        for i in {1..5}; do
          git pull --rebase origin main && git push origin HEAD:main && break || sleep 5
        done

