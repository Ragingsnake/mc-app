# Global Environment Toggle
environment: prod

global:
  probes:
    liveness:
      path: /health/live
      initialDelaySeconds: 5
      periodSeconds: 10
    readiness:
      path: /health/ready
      initialDelaySeconds: 5
      periodSeconds: 10

# ==============================================================================
# 1. User Interface (Frontend)
# ==============================================================================
frontend:
  replicaCount: 1
  image:
    repository: frontend
    tag: v1.0.0
    pullPolicy: Never
  service:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: 32227

# ==============================================================================
# 2. Consolidated Custom Microservices
# ==============================================================================
microservices:
  api-gateway:
    replicaCount: 2
    image:
      repository: api-gateway
      tag: v1.0.0
      pullPolicy: Never
    port: 5000
    env:
      - name: REDIS_HOST
        value: redis
      - name: STORY_ORCHESTRATOR_URL
        value: http://story-orchestrator:5015
      - name: STORY_DB_SERVICE_URL
        value: http://story-db-service:5002

  story-orchestrator:
    replicaCount: 2
    image:
      repository: story-orchestrator
      tag: v1.0.0
      pullPolicy: Never
    port: 5015

  scenario-gen:
    replicaCount: 2
    image:
      repository: scenario-gen
      tag: v1.0.0
      pullPolicy: Never
    port: 5012
    resources:
      requests:
        cpu: "10m"
        memory: "64Mi"
      limits:
        cpu: "250m"
        memory: "128Mi"

  battle-gen:
    replicaCount: 2
    image:
      repository: battle-gen
      tag: v1.0.0
      pullPolicy: Never
    port: 5013
    resources:
      requests:
        cpu: "10m"
        memory: "64Mi"
      limits:
        cpu: "250m"
        memory: "128Mi"

  character-gen:
    replicaCount: 2
    image:
      repository: character-gen
      tag: v1.0.0
      pullPolicy: Never
    port: 5011
    resources:
      requests:
        cpu: "10m"
        memory: "64Mi"
      limits:
        cpu: "250m"
        memory: "128Mi"

  endings-gen:
    replicaCount: 2
    image:
      repository: endings-gen
      tag: v1.0.0
      pullPolicy: Never
    port: 5014

  story-db-service:
    replicaCount: 2
    image:
      repository: story-db-service
      tag: v1.0.0
      pullPolicy: Never
    port: 5002
    env:
      - name: DATABASE_URI
        valueFrom:
          secretKeyRef:
            name: db-credentials
            key: uri

# ==============================================================================
# 3. Databases & Persistence
# ==============================================================================
postgres:
  replicaCount: 1
  image:
    repository: postgres
    tag: 13-alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432

redis:
  replicaCount: 1
  image:
    repository: redis
    tag: alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
    targetPort: 6379
