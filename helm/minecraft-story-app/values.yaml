environment: prod
global:
  probes:
    liveness:
      path: /health/live
      initialDelaySeconds: 5
      periodSeconds: 10
    readiness:
      path: /health/ready
      initialDelaySeconds: 5
      periodSeconds: 10
frontend:
  replicaCount: 1
  image:
    repository: ragingsnake/mc-app
    tag: v1.0.0
    pullPolicy: Always
  service:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: 32227
microservices:
  api-gateway:
    replicaCount: 2
    image:
      repository: ragingsnake/mc-app
      tag: v1.0.0
      pullPolicy: Always
    port: 5000
    env:
    - name: REDIS_HOST
      value: redis
    - name: STORY_ORCHESTRATOR_URL
      value: http://story-orchestrator:5015
    - name: STORY_DB_SERVICE_URL
      value: http://story-db-service:5002
    hpa:
      minReplicas: 2
      maxReplicas: 6
      cpuTargetPercent: 60
  story-orchestrator:
    replicaCount: 2
    image:
      repository: ragingsnake/mc-app
      tag: v1.0.0
      pullPolicy: Always
    port: 5015
    hpa:
      minReplicas: 2
      maxReplicas: 6
      cpuTargetPercent: 60
  scenario-gen:
    replicaCount: 2
    image:
      repository: ragingsnake/mc-app
      tag: v1.0.0
      pullPolicy: Always
    port: 5012
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
    hpa:
      minReplicas: 2
      maxReplicas: 8
      cpuTargetPercent: 60
  battle-gen:
    replicaCount: 2
    image:
      repository: ragingsnake/mc-app
      tag: v1.0.0
      pullPolicy: Always
    port: 5013
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
    hpa:
      minReplicas: 2
      maxReplicas: 8
      cpuTargetPercent: 60
  character-gen:
    replicaCount: 2
    image:
      repository: ragingsnake/mc-app
      tag: v1.0.0
      pullPolicy: Always
    port: 5011
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
    hpa:
      minReplicas: 1
      maxReplicas: 4
      cpuTargetPercent: 70
  endings-gen:
    replicaCount: 2
    image:
      repository: ragingsnake/mc-app
      tag: v1.0.0
      pullPolicy: Always
    port: 5014
  ai-enhancer:
    replicaCount: 1
    image:
      repository: ragingsnake/mc-app
      tag: v1.0.0
      pullPolicy: Always
    port: 5016
    env:
    - name: GEMINI_API_KEY
      valueFrom:
        secretKeyRef:
          name: ai-credentials
          key: GEMINI_API_KEY
    - name: HTTP_PROXY
      value: http://host.docker.internal:3128
    - name: HTTPS_PROXY
      value: http://host.docker.internal:3128
  story-db-service:
    replicaCount: 2
    image:
      repository: ragingsnake/mc-app
      tag: v1.0.0
      pullPolicy: Always
    port: 5002
    env:
    - name: DATABASE_URI
      valueFrom:
        secretKeyRef:
          name: db-credentials
          key: uri
postgres:
  replicaCount: 1
  image:
    repository: postgres
    tag: 13-alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432
redis:
  replicaCount: 1
  image:
    repository: redis
    tag: alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
    targetPort: 6379
