environment: prod
frontend:
  image:
    pullPolicy: Always
    repository: ragingsnake/mc-app
    tag: 5af997c830e9aec393ee391e7e821a3346955c4a
  replicaCount: 1
  service:
    nodePort: 32227
    port: 80
    targetPort: 80
    type: NodePort
global:
  probes:
    liveness:
      initialDelaySeconds: 5
      path: /health/live
      periodSeconds: 10
    readiness:
      initialDelaySeconds: 5
      path: /health/ready
      periodSeconds: 10
microservices:
  ai-enhancer:
    env:
    - name: GEMINI_API_KEY
      valueFrom:
        secretKeyRef:
          key: GEMINI_API_KEY
          name: ai-credentials
    - name: HTTP_PROXY
      value: http://host.docker.internal:3128
    - name: HTTPS_PROXY
      value: http://host.docker.internal:3128
    image:
      pullPolicy: Always
      repository: ragingsnake/mc-app
      tag: 5af997c830e9aec393ee391e7e821a3346955c4a
    port: 5016
    replicaCount: 1
  api-gateway:
    env:
    - name: REDIS_HOST
      value: redis
    - name: STORY_ORCHESTRATOR_URL
      value: http://story-orchestrator:5015
    - name: STORY_DB_SERVICE_URL
      value: http://story-db-service:5002
    hpa:
      cpuTargetPercent: 60
      maxReplicas: 6
      minReplicas: 2
    image:
      pullPolicy: Always
      repository: ragingsnake/mc-app
      tag: 5af997c830e9aec393ee391e7e821a3346955c4a
    port: 5000
    replicaCount: 2
  battle-gen:
    hpa:
      cpuTargetPercent: 60
      maxReplicas: 8
      minReplicas: 2
    image:
      pullPolicy: Always
      repository: ragingsnake/mc-app
      tag: 5af997c830e9aec393ee391e7e821a3346955c4a
    port: 5013
    replicaCount: 2
    resources:
      limits:
        cpu: 250m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 64Mi
  character-gen:
    hpa:
      cpuTargetPercent: 70
      maxReplicas: 4
      minReplicas: 1
    image:
      pullPolicy: Always
      repository: ragingsnake/mc-app
      tag: 5af997c830e9aec393ee391e7e821a3346955c4a
    port: 5011
    replicaCount: 2
    resources:
      limits:
        cpu: 250m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 64Mi
  endings-gen:
    image:
      pullPolicy: Always
      repository: ragingsnake/mc-app
      tag: 5af997c830e9aec393ee391e7e821a3346955c4a
    port: 5014
    replicaCount: 2
  scenario-gen:
    hpa:
      cpuTargetPercent: 60
      maxReplicas: 8
      minReplicas: 2
    image:
      pullPolicy: Always
      repository: ragingsnake/mc-app
      tag: 5af997c830e9aec393ee391e7e821a3346955c4a
    port: 5012
    replicaCount: 2
    resources:
      limits:
        cpu: 250m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 64Mi
  story-db-service:
    env:
    - name: DATABASE_URI
      valueFrom:
        secretKeyRef:
          key: uri
          name: db-credentials
    image:
      pullPolicy: Always
      repository: ragingsnake/mc-app
      tag: 5af997c830e9aec393ee391e7e821a3346955c4a
    port: 5002
    replicaCount: 2
  story-orchestrator:
    hpa:
      cpuTargetPercent: 60
      maxReplicas: 6
      minReplicas: 2
    image:
      pullPolicy: Always
      repository: ragingsnake/mc-app
      tag: 5af997c830e9aec393ee391e7e821a3346955c4a
    port: 5015
    replicaCount: 2
postgres:
  image:
    pullPolicy: IfNotPresent
    repository: postgres
    tag: 13-alpine
  replicaCount: 1
  service:
    port: 5432
    targetPort: 5432
    type: ClusterIP
redis:
  image:
    pullPolicy: IfNotPresent
    repository: redis
    tag: alpine
  replicaCount: 1
  service:
    port: 6379
    targetPort: 6379
    type: ClusterIP
