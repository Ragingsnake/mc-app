
apiVersion: apps/v1
kind: Deployment
metadata:
  name: story-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: story-service
  template:
    metadata:
      labels:
        app: story-service
    spec:
      containers:
        - name: story-service
          image: story-story-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5003
          env:
            - name: CHARACTER_SERVICE_URL
              value: "http://character-service:5001"
            - name: ACTION_SERVICE_URL
              value: "http://action-service:5002"
---
apiVersion: v1
kind: Service
metadata:
  name: story-service
spec:
  ports:
    - port: 5003
      targetPort: 5003
  selector:
    app: story-service
