name: CI Chain (Smart)

permissions:
  contents: write

on:
  push:
    paths:
      - 'frontend/**'
      - 'backend/**'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build and tag (e.g. frontend, api-gateway). Leave empty to build ALL.'
        required: false
        default: ''

env:
  REGISTRY: docker.io/ragingsnake/mc-app

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.set-output.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            frontend: 'frontend/**'
            api-gateway: 'backend/api-gateway/**'
            story-orchestrator: 'backend/story-orchestrator/**'
            scenario-gen: 'backend/scenario-gen/**'
            battle-gen: 'backend/battle-gen/**'
            character-gen: 'backend/character-gen/**'
            endings-gen: 'backend/endings-gen/**'
            story-db-service: 'backend/story-db-service/**'
            ai-enhancer: 'backend/ai-enhancer/**'

      - name: Set changes output
        id: set-output
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.service }}" ]; then
              echo 'changes=["${{ github.event.inputs.service }}"]' >> $GITHUB_OUTPUT
            else
              echo 'changes=["frontend","api-gateway","story-orchestrator","scenario-gen","battle-gen","character-gen","endings-gen","story-db-service","ai-enhancer"]' >> $GITHUB_OUTPUT
            fi
          else
            echo "changes=${{ steps.filter.outputs.changes }}" >> $GITHUB_OUTPUT
          fi

  sys-scan:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.changes != '[]' && needs.detect-changes.outputs.changes != '' }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.changes) }}

    env:
      SERVICE: ${{ matrix.service }}

    steps:
    - name: Pull repo
      uses: actions/checkout@v4

    - name: Set working directory path
      run: |
        if [ "$SERVICE" = "frontend" ]; then
          echo "SVC_PATH=./frontend" >> $GITHUB_ENV
        else
          echo "SVC_PATH=./backend/$SERVICE" >> $GITHUB_ENV
        fi

    - name: Lint check (frontend)
      if: env.SERVICE == 'frontend'
      working-directory: ${{ env.SVC_PATH }}
      run: |
        npm install
        npm install @oxlint/binding-linux-x64-gnu
        npx oxlint

    - name: Build check (frontend)
      if: env.SERVICE == 'frontend'
      working-directory: ${{ env.SVC_PATH }}
      run: npm run build

    - name: Lint check (Python)
      if: env.SERVICE != 'frontend'
      working-directory: ${{ env.SVC_PATH }}
      run: python -m py_compile app.py

    - name: Trivy Filesystem Scan
      working-directory: ${{ env.SVC_PATH }}
      run: |
        cat <<EOF > Dockerfile.trivy
        FROM aquasec/trivy:latest
        COPY . /app-to-scan
        WORKDIR /app-to-scan
        EOF
        
        docker build -f Dockerfile.trivy -t disposable-trivy-scanner-$SERVICE .
        docker run --rm disposable-trivy-scanner-$SERVICE fs \
          --db-repository ghcr.io/aquasecurity/trivy-db:2 \
          --severity CRITICAL,HIGH \
          --exit-code 1 .

    - name: Log in to Docker Hub
      run: |
        echo "${{ secrets.DOCKER_PAT }}" | docker login -u "ragingsnake" --password-stdin

    - name: Build Docker Image
      working-directory: ${{ env.SVC_PATH }}
      run: |
        docker build -t ${{ env.REGISTRY }}:${{ env.SERVICE }}-${{ github.sha }} .

    - name: Push Docker Image
      run: |
        docker push ${{ env.REGISTRY }}:${{ env.SERVICE }}-${{ github.sha }}

  update-image-tags:
    needs: [detect-changes, sys-scan]
    if: ${{ needs.detect-changes.outputs.changes != '[]' && needs.detect-changes.outputs.changes != '' }}
    runs-on: ubuntu-latest

    env:
      CHANGES_JSON: ${{ needs.detect-changes.outputs.changes }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: pip install pyyaml

    - name: Update tags in values.yaml
      run: |
        cat << 'EOF' > /tmp/update_tags.py
        import yaml, sys, json, os
        sha = sys.argv[1]
        services = json.loads(os.environ['CHANGES_JSON'])
        
        with open('helm/minecraft-story-app/values.yaml', 'r') as f:
            data = yaml.safe_load(f)
            
        for service in services:
            if service == 'frontend':
                data['frontend']['image']['tag'] = sha
            else:
                data['microservices'][service]['image']['tag'] = sha
            print(f'Updated {service} tag to {sha}')
            
        with open('helm/minecraft-story-app/values.yaml', 'w') as f:
            yaml.dump(data, f, default_flow_style=False, allow_unicode=True)
        EOF
        python3 /tmp/update_tags.py ${{ github.sha }}

    - name: Commit and Push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        git add helm/minecraft-story-app/values.yaml
        git diff --cached --exit-code && echo "No change, skipping." && exit 0
        git commit -m "ci: update image tags to ${{ github.sha }} [skip ci]"
        for i in {1..5}; do
          git pull --rebase origin main && git push origin HEAD:main && break || sleep 5
        done
